assert_lefthook_installed: true

# This file stays at the repo root: lefthook only reads the config next to
# .git, so moving it alongside the Go module would silently disable the hooks.
# Each hook runs one `just` verb and nothing else. The recipes resolve their own
# staged files and their own working directories, so no `root`, `glob` or
# `{staged_files}` plumbing belongs here - and `just check` stays runnable by
# hand, outside any hook.

pre-commit:
  commands:
    check:
      run: just check
      stage_fixed: true

pre-push:
  commands:
    check-ci:
      run: just check-ci
