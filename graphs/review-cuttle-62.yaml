  - name: lens-claims
    prompt: |
      You are reviewing one pull request for prose that asserts what the code
      does not do. Report findings only; change nothing.

      PULL REQUEST
      glim-sh/cuttle #62, "fix(viewer): keep websocket inside proxy prefix"
      (+388/-7, 4 files). The shipped noVNC viewer page now resolves its
      websocket URL relative to the page instead of the origin root, so a
      path-prefixing reverse proxy keeps its prefix; a smoke harness driving
      the page through test proxies comes with it.

      MATERIALS
      - The unified diff of the pull request: {{input:diff}}
      - The pull request's description, as its author wrote it:
        {{input:pr_body}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.
      - You have no network access to GitHub; the diff file, the description
        and the checkout are the whole record of the change.

      WHAT TO LOOK FOR
      Every sentence that states what the code does is a claim, and a claim is
      true only if the code says so. Hunt the claims this change leaves false:
      - Comments the diff adds, and comments it leaves standing in the files
        it touches. A comment the change made false is the same defect as one
        that was always false.
      - Doc strings, README text, operating notes, chart values, environment
        variable documentation and CI step names that describe the behaviour
        the change moved.
      - The pull request description: every behaviour it claims, every
        guarantee it offers, every "this makes X work" and "Y is unaffected".
      - Test names, harness names and assertion messages that state a property
        the code under them does not actually check.

      HOW TO SETTLE A CLAIM - the method, not an option
      For each claim, name its authority: the file or files whose contents
      decide whether it is true. Then READ THOSE FILES END TO END, first line
      to last. Do not grep them for a keyword and read the hits. A claim about
      routing is settled by the whole of the router, a claim about a proxy by
      the whole of the proxy configuration, a claim about a test by the whole
      of the test. Keyword search is exactly how this class of defect is
      missed: the line that contradicts a claim almost never contains the
      claim's words. Search may FIND a candidate authority file; it may never
      decide a claim.

      WHAT ELSE REMAINS IN SCOPE
      The bullets and the method above are a floor, not the job. They name the
      claim surfaces already known to hide defects; they do not bound this
      lens. Working through them is the start of your work, not the end of it:
      any other prose in this repository that asserts something about the
      changed behaviour is yours too, and so is a claim you notice in passing
      that no bullet named. A claim outside the diff's four files counts the
      same as one inside them. Finishing the list is not finishing the lens.

      Report the disagreement between prose and code, not the wording. A
      sentence that is merely vague, awkward or unidiomatic is not a finding;
      a sentence the code disproves is.

      RUBRIC - every finding carries one
      A finding is not an opinion; it is a check someone else can run. Give
      each one a "rubric": an acceptance test in the form "run X, expect Y",
      where X is a command with its arguments or a concrete observation
      someone can make of this repository, and Y is the outcome that proves
      the finding. Write it so a verifier with read access to this checkout
      can carry it out and get a yes or a no - name the file to open and the
      line to look at, the input to trace and the value that must come out,
      the command and the output it must produce. "Review the logic" and
      "consider whether" are not rubrics. When you genuinely cannot state one,
      write a rubric beginning with the word "none" followed by one sentence
      saying why no check can be stated, and set that finding's severity to
      "suggestion": an unfalsifiable finding never rises higher than that.

      OUTPUT
      Write your findings to {{artifact}} and write nothing else to that file.
      The file must contain VALID JSON and nothing else: no prose, no markdown
      fence, no comment. It is a JSON array whose every element is an object
      with exactly these keys:
        "id"       - string, "lens-claims-N" with N counting from 1
        "file"     - string, repository-relative path of the file holding the
                     false claim, or exactly "PULL_REQUEST_DESCRIPTION" when
                     the claim is in the pull request's description
        "line"     - integer, the line holding the claim, counted in that file
                     or, for the description, in the description text
        "severity" - string, one of "high", "medium", "low", "suggestion"
        "summary"  - string, one sentence stating the claim and what the code
                     actually does instead
        "evidence" - string, the quoted claim together with the quoted code
                     that disproves it, naming the authority file you read
        "rubric"   - string, the acceptance test, "run X, expect Y", or a
                     "none ..." string when none can be stated
      If you find nothing, write exactly [] to that file. Ask no questions.
      Stop as soon as the file is written.
    artifact: lens-claims.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; has(\"id\") and has(\"file\") and has(\"line\") and has(\"severity\") and has(\"summary\") and has(\"evidence\") and (.rubric | type == \"string\") and (.rubric | length > 0) and ((.rubric | ascii_downcase | startswith(\"none\") | not) or .severity == \"suggestion\"))", "{{artifact}}"]

  - name: verify-correctness
    needs: [lens-correctness]
    prompt: |
      A reviewer produced findings about pull request glim-sh/cuttle #62
      ("fix(viewer): keep websocket inside proxy prefix"). Reviewer findings are
      frequently wrong. Your job is to re-derive every one of them from the
      actual code and rule on it. Believe a finding for what it points at, never
      because the reviewer asserted it.

      MATERIALS
      - The reviewer's findings, a JSON array: {{artifact:lens-correctness}}
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.

      METHOD
      For each finding, in order:
      1. Open the file it names in the checkout and read the code around the
         line it names. The reviewer's quoted evidence may be paraphrased,
         mislocated or invented - the file is the authority.
      2. Carry out the finding's rubric. Its outcome, not your impression of
         the reviewer's prose, decides the verdict. The rubric states a check
         in the form "run X, expect Y": run that command in this checkout, or
         make that observation of it, and compare what actually comes out with
         what the rubric expected. Where the rubric is an observation rather
         than a command, make it concretely: what input reaches that code, what
         it produces, what the caller does with it. The expectation holds, so
         the verdict is "confirmed"; it does not hold, so the verdict is
         "rejected". A finding that is real but for a different reason than
         stated is "confirmed"; correct its summary. If the reviewer's rubric
         was too vague to carry out, sharpen it until it can be carried out and
         report the sharpened wording. A rubric beginning with "none" has
         nothing to execute: judge the finding by reading the code, and leave
         its severity at "suggestion".
      3. Record the exact evidence you read: the file and line you verified at,
         and the actual content of that line copied verbatim from the file.
      Keep the reviewer's id, and keep every finding - reject, never drop. If
      the reviewer's file or line does not exist, the verdict is "rejected" and
      the evidence says so.

      OUTPUT
      Write to {{artifact}} and write nothing else to that file. The file must
      contain VALID JSON and nothing else: no prose, no markdown fence, no
      comment. It is a JSON array with one element per reviewer finding, in the
      reviewer's order, each an object with exactly these keys:
        "id"                 - string, the reviewer's id, unchanged
        "file"               - string, repository-relative path
        "line"               - integer
        "severity"           - string, one of "high", "medium", "low",
                               "suggestion"; correct the reviewer's if your
                               reading disagrees
        "summary"            - string, one sentence; corrected if needed
        "verdict"            - string, "confirmed" or "rejected"
        "verified_evidence"  - string, "<file>:<line>: <the actual content of
                               that line, copied from the file>", plus one
                               sentence saying what that line proves
        "rubric"             - string, the rubric you actually carried out:
                               the reviewer's, or your sharpened wording of it
        "rubric_outcome"     - string, what carrying it out actually produced
                               and whether that is what the rubric expected;
                               "not executed: <why>" for a "none ..." rubric
      If the reviewer's array was empty, write exactly [] to that file. Ask no
      questions. Stop as soon as the file is written.
    artifact: verify-correctness.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; (.verdict == \"confirmed\" or .verdict == \"rejected\") and (.verified_evidence | type == \"string\") and has(\"id\") and (.rubric | type == \"string\") and (.rubric | length > 0) and (.rubric_outcome | type == \"string\") and (.rubric_outcome | length > 0) and ((.rubric | ascii_downcase | startswith(\"none\") | not) or .severity == \"suggestion\"))", "{{artifact}}"]

  - name: verify-callpaths
    needs: [lens-callpaths]
    prompt: |
      A reviewer produced findings about pull request glim-sh/cuttle #62
