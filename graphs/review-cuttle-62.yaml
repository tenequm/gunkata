  - name: reconcile
    needs: [verify-cleanliness, verify-design, verify-efficiency, verify-gating]
    model: gemini-3.7-flash-medium
    timeout_seconds: 300
    prompt: |
      Four verified finding sets about pull request glim-sh/cuttle #62
      ("fix(viewer): keep websocket inside proxy prefix") must be merged into one
      ledger. Nothing may be dropped and nothing may be counted twice.

      MATERIALS
      - {{artifact:verify-cleanliness}}
      - {{artifact:verify-design}}
      - {{artifact:verify-efficiency}}
      - {{artifact:verify-gating}}
      Each is a JSON array of verified findings. Read all four in full. You do
      not need the repository for this step; do not modify anything anywhere.

      METHOD
      1. Take the union of all elements of all four arrays. Every id that
         appears in any input must appear in your output exactly once. Do not
         invent a finding that is in none of them.
      2. Two findings are duplicates when they point at the same defect, even if
         their file, line or wording differ. Within a duplicate group keep the
         one with the strongest verified_evidence as the survivor, give it the
         disposition its verdict implies, and give every other member of the
         group the disposition "duplicate" with "duplicate_of" set to the
         survivor's id. A survivor is never a duplicate of anything.
      3. A non-duplicate finding takes the disposition "confirmed" or "rejected"
         from its verdict, unchanged.
      4. Order the output by severity, "high" first, then "medium", then "low";
         within a severity, confirmed before rejected before duplicate.

      OUTPUT
      Write to {{artifact}} and write nothing else to that file. The file must
      contain VALID JSON and nothing else: no prose, no markdown fence, no
      comment. It is a JSON array, each element an object with exactly these
      keys:
        "id"                 - string, the finding's original id
        "lens"               - string, "lens-cleanliness", "lens-design",
                               "lens-efficiency" or "lens-gating", the lens the
                               id came from
        "file"               - string, repository-relative path
        "line"               - integer
        "severity"           - string, one of "high", "medium", "low"
        "summary"            - string, one sentence
        "verified_evidence"  - string, carried over unchanged
        "disposition"        - string, "confirmed", "rejected" or "duplicate"
        "duplicate_of"       - string, present only when disposition is
                               "duplicate", holding the surviving finding's id
      If all four inputs were empty, write exactly [] to that file. Ask no
      questions. Stop as soon as the file is written.
    artifact: ledger.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; (.disposition == \"confirmed\" or .disposition == \"rejected\" or .disposition == \"duplicate\") and (.disposition != \"duplicate\" or has(\"duplicate_of\")) and has(\"id\"))", "{{artifact}}"]

