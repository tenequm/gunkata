# PR-specific review graph for glim-sh/cuttle#62 ("fix(viewer): keep websocket
# inside proxy prefix"). Not part of examples/ - that directory is the graded
# corpus and this graph is not graded.
#
# Run: gunkata run --input diff=<path-to-cuttle-pr62.diff> graphs/review-cuttle-62.yaml
#
# Shape: 3 independent lenses -> one verify per lens -> one reconcile.
# The lenses find, the verifies re-derive each finding from the actual code
# (G2/G3), and reconcile keeps every finding exactly once (G5).
name: review-cuttle-62

inputs:
  - diff

defaults:
  agent: agy-acp-server
  model: gemini-3.7-flash-low
  timeout_seconds: 600

nodes:
  - name: lens-correctness
    prompt: |
      You are reviewing one pull request for correctness. Report findings only;
      change nothing.

      PULL REQUEST
      glim-sh/cuttle #62, "fix(viewer): keep websocket inside proxy prefix"
      (+388/-7, 4 files). The shipped noVNC viewer page used to build its
      websocket URL from the origin root; the change resolves it relative to the
      page instead, so a path-prefixing reverse proxy keeps the prefix. A smoke
      harness that drives the page through a real browser behind two test
      proxies comes with it.

      MATERIALS
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.
      - You have no network access to GitHub; the diff file and the checkout are
        the whole record of the change.

      WHAT TO LOOK FOR
      Is the change itself right? Work through the URL construction the diff
      introduces and the behaviour it produces:
      - Trailing slashes: the page resolves "websockify" against location.href.
        What does that produce when the page URL ends in a slash, when it does
        not, when it carries a query string or a fragment, and when it is an
        index document reached without a slash? The diff's own comment claims a
        proxy redirects the slashless form - check whether anything in this
        repository actually does that.
      - The empty-prefix / no-proxy case: served directly at the origin root,
        does the new construction still yield exactly the old /websockify, or
        has the direct deployment regressed?
      - Scheme: ws: vs wss: selection, where it is applied relative to building
        the URL, and whether it survives a proxy that terminates TLS.
      - Encoding: a prefix containing percent-encoded, non-ASCII or
        dot-segment components, and what URL resolution does to it.
      - Host, port and userinfo carried by location.href into the socket URL.
      - Anything in the new smoke code that asserts a behaviour the page does
        not actually guarantee, or that would pass while the real deployment is
        broken.
      Read the actual file contents in the checkout, not only the diff hunks.
      Ignore style and naming; report behaviour.

      OUTPUT
      Write your findings to {{artifact}} and write nothing else to that file.
      The file must contain VALID JSON and nothing else: no prose, no markdown
      fence, no comment. It is a JSON array whose every element is an object
      with exactly these keys:
        "id"       - string, "lens-correctness-N" with N counting from 1
        "file"     - string, repository-relative path of the offending file
        "line"     - integer, the line in that file the finding points at
        "severity" - string, one of "high", "medium", "low"
        "summary"  - string, one sentence stating the defect
        "evidence" - string, the quoted code that shows it
      If you find nothing, write exactly [] to that file. Ask no questions.
      Stop as soon as the file is written.
    artifact: lens-correctness.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; has(\"id\") and has(\"file\") and has(\"line\") and has(\"severity\") and has(\"summary\") and has(\"evidence\"))", "{{artifact}}"]

  - name: lens-callpaths
    prompt: |
      You are reviewing one pull request for the agreement between the change
      and the rest of the repository. Report findings only; change nothing.

      PULL REQUEST
      glim-sh/cuttle #62, "fix(viewer): keep websocket inside proxy prefix"
      (+388/-7, 4 files). The shipped noVNC viewer page now resolves its
      websocket URL relative to the page instead of the origin root, so a
      path-prefixing reverse proxy keeps its prefix; a smoke harness driving the
      page through test proxies comes with it.

      MATERIALS
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.
      - You have no network access to GitHub; the diff file and the checkout are
        the whole record of the change.

      WHAT TO LOOK FOR
      This is a cross-cutting lens. Follow call paths across the whole
      repository. Do NOT partition your work by file and do not confine yourself
      to the four files the diff touches - the diff is where you start, not
      where you stop.
      - Every other place that builds a websocket, viewer, noVNC or websockify
        URL, in any language: Go, shell, HTML/JS, Dockerfile, Helm chart,
        Justfile, CI workflow, docs. Search for the paths and ports as literals
        as well as by name.
      - Every place that assumes the viewer is served at the origin root, or
        that a path is absolute from "/", and would now disagree with the page.
      - The producers and consumers of the viewer URL: what hands a user or
        another process a viewer link, what serves the page, what proxies it,
        what documents it. Follow each to the point where the prefix would
        either be preserved or lost.
      - Static assets the page loads relative to itself, and whether they and
        the websocket now resolve under the same rule.
      - Anything the change makes stale: comments, docs, operating notes, chart
        values or environment variables that still describe root-relative
        behaviour.
      Read the actual file contents, not only search hits. A finding must name
      the concrete file and line that disagrees.

      OUTPUT
      Write your findings to {{artifact}} and write nothing else to that file.
      The file must contain VALID JSON and nothing else: no prose, no markdown
      fence, no comment. It is a JSON array whose every element is an object
      with exactly these keys:
        "id"       - string, "lens-callpaths-N" with N counting from 1
        "file"     - string, repository-relative path of the offending file
        "line"     - integer, the line in that file the finding points at
        "severity" - string, one of "high", "medium", "low"
        "summary"  - string, one sentence stating the disagreement
        "evidence" - string, the quoted code that shows it
      If you find nothing, write exactly [] to that file. Ask no questions.
      Stop as soon as the file is written.
    artifact: lens-callpaths.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; has(\"id\") and has(\"file\") and has(\"line\") and has(\"severity\") and has(\"summary\") and has(\"evidence\"))", "{{artifact}}"]

  - name: lens-tests
    prompt: |
      You are reviewing one pull request for test coverage and regression risk.
      Report findings only; change nothing.

      PULL REQUEST
      glim-sh/cuttle #62, "fix(viewer): keep websocket inside proxy prefix"
      (+388/-7, 4 files). The shipped noVNC viewer page now resolves its
      websocket URL relative to the page instead of the origin root, so a
      path-prefixing reverse proxy keeps its prefix. Most of the added lines are
      a smoke harness (test/smoke/viewer.go) that drives the page in a real
      browser behind a root proxy and a prefixing proxy, plus CI wiring that
      runs it.

      MATERIALS
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.
      - You have no network access to GitHub; the diff file and the checkout are
        the whole record of the change. Do not run the test suite; read it.

      WHAT TO LOOK FOR
      - Is the changed behaviour actually tested? Which assertion would fail if
        the one-line URL change were reverted? If no assertion would fail, that
        is a high-severity finding.
      - Does the new smoke harness prove what its name claims, or can it pass
        while the deployment is broken - an upgrade recorded but never
        completed, a check that is skipped when an environment variable is
        unset, a timing window, a proxy shape that does not match a real
        prefixing deployment, an error path that reports pass.
      - Do existing tests anywhere in the repository still encode the OLD
        root-relative behaviour, and would they now be asserting the wrong
        thing? Search the Go tests, the shell scripts and the CI workflow.
      - The gap: name the single most valuable test that is missing, with the
        case it would cover (the slashless page URL, the empty prefix, the wss
        path, a prefix with a trailing component).
      - CI wiring: is the new check actually reached by CI, and does a failure
        in it fail the job?
      Read the actual test and workflow files, not only the diff hunks.

      OUTPUT
      Write your findings to {{artifact}} and write nothing else to that file.
      The file must contain VALID JSON and nothing else: no prose, no markdown
      fence, no comment. It is a JSON array whose every element is an object
      with exactly these keys:
        "id"       - string, "lens-tests-N" with N counting from 1
        "file"     - string, repository-relative path of the file the finding is
                     about (for a missing test, the file that should hold it)
        "line"     - integer, the line in that file the finding points at
        "severity" - string, one of "high", "medium", "low"
        "summary"  - string, one sentence stating the gap or the defect
        "evidence" - string, the quoted code that shows it
      If you find nothing, write exactly [] to that file. Ask no questions.
      Stop as soon as the file is written.
    artifact: lens-tests.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; has(\"id\") and has(\"file\") and has(\"line\") and has(\"severity\") and has(\"summary\") and has(\"evidence\"))", "{{artifact}}"]

  - name: verify-correctness
    needs: [lens-correctness]
    prompt: |
      A reviewer produced findings about pull request glim-sh/cuttle #62
      ("fix(viewer): keep websocket inside proxy prefix"). Reviewer findings are
      frequently wrong. Your job is to re-derive every one of them from the
      actual code and rule on it. Believe a finding for what it points at, never
      because the reviewer asserted it.

      MATERIALS
      - The reviewer's findings, a JSON array: {{artifact:lens-correctness}}
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.

      METHOD
      For each finding, in order:
      1. Open the file it names in the checkout and read the code around the
         line it names. The reviewer's quoted evidence may be paraphrased,
         mislocated or invented - the file is the authority.
      2. Decide whether the defect the summary describes is really present in
         that code, for the reason given. Reason it through concretely: what
         input reaches that code, what it produces, what the caller does with
         it. A finding that is real but for a different reason than stated is
         "confirmed"; correct its summary. A finding whose code does not say
         what the reviewer claims is "rejected".
      3. Record the exact evidence you read: the file and line you verified at,
         and the actual content of that line copied verbatim from the file.
      Keep the reviewer's id, and keep every finding - reject, never drop. If
      the reviewer's file or line does not exist, the verdict is "rejected" and
      the evidence says so.

      OUTPUT
      Write to {{artifact}} and write nothing else to that file. The file must
      contain VALID JSON and nothing else: no prose, no markdown fence, no
      comment. It is a JSON array with one element per reviewer finding, in the
      reviewer's order, each an object with exactly these keys:
        "id"                 - string, the reviewer's id, unchanged
        "file"               - string, repository-relative path
        "line"               - integer
        "severity"           - string, one of "high", "medium", "low"; correct
                               the reviewer's if your reading disagrees
        "summary"            - string, one sentence; corrected if needed
        "verdict"            - string, "confirmed" or "rejected"
        "verified_evidence"  - string, "<file>:<line>: <the actual content of
                               that line, copied from the file>", plus one
                               sentence saying what that line proves
      If the reviewer's array was empty, write exactly [] to that file. Ask no
      questions. Stop as soon as the file is written.
    artifact: verify-correctness.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; (.verdict == \"confirmed\" or .verdict == \"rejected\") and (.verified_evidence | type == \"string\") and has(\"id\"))", "{{artifact}}"]

  - name: verify-callpaths
    needs: [lens-callpaths]
    prompt: |
      A reviewer produced findings about pull request glim-sh/cuttle #62
      ("fix(viewer): keep websocket inside proxy prefix"), looking for places in
      the repository that disagree with the change. Reviewer findings are
      frequently wrong. Your job is to re-derive every one of them from the
      actual code and rule on it. Believe a finding for what it points at, never
      because the reviewer asserted it.

      MATERIALS
      - The reviewer's findings, a JSON array: {{artifact:lens-callpaths}}
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all.

      METHOD
      For each finding, in order:
      1. Open the file it names in the checkout and read the code around the
         line it names. The reviewer's quoted evidence may be paraphrased,
         mislocated or invented - the file is the authority.
      2. Follow the call path yourself from that line to the viewer page or the
         websocket URL, and decide whether the disagreement is real: does that
         code actually run in the prefixed deployment, does it actually assume a
         root prefix, would it actually break. Dead code, a path that never
         reaches the viewer, or an assumption the code does not in fact make is
         "rejected". A finding that is real but for a different reason than
         stated is "confirmed"; correct its summary.
      3. Record the exact evidence you read: the file and line you verified at,
         and the actual content of that line copied verbatim from the file.
      Keep the reviewer's id, and keep every finding - reject, never drop. If
      the reviewer's file or line does not exist, the verdict is "rejected" and
      the evidence says so.

      OUTPUT
      Write to {{artifact}} and write nothing else to that file. The file must
      contain VALID JSON and nothing else: no prose, no markdown fence, no
      comment. It is a JSON array with one element per reviewer finding, in the
      reviewer's order, each an object with exactly these keys:
        "id"                 - string, the reviewer's id, unchanged
        "file"               - string, repository-relative path
        "line"               - integer
        "severity"           - string, one of "high", "medium", "low"; correct
                               the reviewer's if your reading disagrees
        "summary"            - string, one sentence; corrected if needed
        "verdict"            - string, "confirmed" or "rejected"
        "verified_evidence"  - string, "<file>:<line>: <the actual content of
                               that line, copied from the file>", plus one
                               sentence saying what that line proves
      If the reviewer's array was empty, write exactly [] to that file. Ask no
      questions. Stop as soon as the file is written.
    artifact: verify-callpaths.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; (.verdict == \"confirmed\" or .verdict == \"rejected\") and (.verified_evidence | type == \"string\") and has(\"id\"))", "{{artifact}}"]

  - name: verify-tests
    needs: [lens-tests]
    prompt: |
      A reviewer produced findings about the test coverage of pull request
      glim-sh/cuttle #62 ("fix(viewer): keep websocket inside proxy prefix").
      Reviewer findings are frequently wrong. Your job is to re-derive every one
      of them from the actual code and rule on it. Believe a finding for what it
      points at, never because the reviewer asserted it.

      MATERIALS
      - The reviewer's findings, a JSON array: {{artifact:lens-tests}}
      - The unified diff of the pull request: {{input:diff}}
      - The repository, checked out at the pull request's head commit
        8fd8af8f96ca8f5cba5975c9228f2cb5e252c6e3:
        /home/tenequm/pjv/glim-sh/cuttle
        READ ONLY. Never write, create, delete, move, rename, stage, commit,
        checkout or otherwise modify anything under that directory, and never
        run a command that would. Read files and search them; that is all. Do
        not run the test suite; read it.

      METHOD
      For each finding, in order:
      1. Open the file it names in the checkout and read the test or workflow
         code around the line it names. The reviewer's quoted evidence may be
         paraphrased, mislocated or invented - the file is the authority.
      2. Decide whether the claim holds by tracing the assertion: for a claimed
         coverage gap, search the repository for any assertion that would fail
         under the change the reviewer says is untested - if one exists, the
         finding is "rejected". For a claimed weak or misleading test, read what
         the harness actually does on that path and decide whether it can pass
         while the behaviour is broken. For a claimed stale test, read what it
         asserts now. A finding that is real but for a different reason than
         stated is "confirmed"; correct its summary.
      3. Record the exact evidence you read: the file and line you verified at,
         and the actual content of that line copied verbatim from the file.
      Keep the reviewer's id, and keep every finding - reject, never drop. If
      the reviewer's file or line does not exist, the verdict is "rejected" and
      the evidence says so.

      OUTPUT
      Write to {{artifact}} and write nothing else to that file. The file must
      contain VALID JSON and nothing else: no prose, no markdown fence, no
      comment. It is a JSON array with one element per reviewer finding, in the
      reviewer's order, each an object with exactly these keys:
        "id"                 - string, the reviewer's id, unchanged
        "file"               - string, repository-relative path
        "line"               - integer
        "severity"           - string, one of "high", "medium", "low"; correct
                               the reviewer's if your reading disagrees
        "summary"            - string, one sentence; corrected if needed
        "verdict"            - string, "confirmed" or "rejected"
        "verified_evidence"  - string, "<file>:<line>: <the actual content of
                               that line, copied from the file>", plus one
                               sentence saying what that line proves
      If the reviewer's array was empty, write exactly [] to that file. Ask no
      questions. Stop as soon as the file is written.
    artifact: verify-tests.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; (.verdict == \"confirmed\" or .verdict == \"rejected\") and (.verified_evidence | type == \"string\") and has(\"id\"))", "{{artifact}}"]

  - name: reconcile
    needs: [verify-correctness, verify-callpaths, verify-tests]
    timeout_seconds: 300
    prompt: |
      Three verified finding sets about pull request glim-sh/cuttle #62
      ("fix(viewer): keep websocket inside proxy prefix") must be merged into one
      ledger. Nothing may be dropped and nothing may be counted twice.

      MATERIALS
      - {{artifact:verify-correctness}}
      - {{artifact:verify-callpaths}}
      - {{artifact:verify-tests}}
      Each is a JSON array of verified findings. Read all three in full. You do
      not need the repository for this step; do not modify anything anywhere.

      METHOD
      1. Take the union of all elements of all three arrays. Every id that
         appears in any input must appear in your output exactly once. Do not
         invent a finding that is in none of them.
      2. Two findings are duplicates when they point at the same defect, even if
         their file, line or wording differ. Within a duplicate group keep the
         one with the strongest verified_evidence as the survivor, give it the
         disposition its verdict implies, and give every other member of the
         group the disposition "duplicate" with "duplicate_of" set to the
         survivor's id. A survivor is never a duplicate of anything.
      3. A non-duplicate finding takes the disposition "confirmed" or "rejected"
         from its verdict, unchanged.
      4. Order the output by severity, "high" first, then "medium", then "low";
         within a severity, confirmed before rejected before duplicate.

      OUTPUT
      Write to {{artifact}} and write nothing else to that file. The file must
      contain VALID JSON and nothing else: no prose, no markdown fence, no
      comment. It is a JSON array, each element an object with exactly these
      keys:
        "id"                 - string, the finding's original id
        "lens"               - string, "lens-correctness", "lens-callpaths" or
                               "lens-tests", the lens the id came from
        "file"               - string, repository-relative path
        "line"               - integer
        "severity"           - string, one of "high", "medium", "low"
        "summary"            - string, one sentence
        "verified_evidence"  - string, carried over unchanged
        "disposition"        - string, "confirmed", "rejected" or "duplicate"
        "duplicate_of"       - string, present only when disposition is
                               "duplicate", holding the surviving finding's id
      If all three inputs were empty, write exactly [] to that file. Ask no
      questions. Stop as soon as the file is written.
    artifact: ledger.json
    check: ["jq", "-e", "type == \"array\" and all(.[]; (.disposition == \"confirmed\" or .disposition == \"rejected\" or .disposition == \"duplicate\") and (.disposition != \"duplicate\" or has(\"duplicate_of\")) and has(\"id\"))", "{{artifact}}"]
