# Every field the kata spec (docs/spec.md) allows, in one file.
name: full

params:
  repo: {}                        # required: -p repo=<url or local path>
  ref: {default: main}            # optional: default used when unbound
  brief: {}                       # a param bound to an existing file is snapshotted
                                  # into the run dir; {{param:brief}} expands to the copy

agents:
  executor:
    harness: claude               # the acpx family that runs the job (claude, agy, ...)
    model: claude-opus-5
    acp_adapter: "@agentclientprotocol/claude-agent-acp@0.79.0"   # optional: pins the ACP
                                  # adapter package acpx runs via npx; absent = acpx's own
    # optional, claude only: appended to the agent's own system prompt;
    # placeholders expand here as in prompt
    append_system_prompt: |
      Work in small, reviewable commits.
    timeout_seconds: 3600
    options:                      # harness-specific settings, passed through the adapter
      reasoning_effort: high
    skills:                       # skill dirs, materialized into the bare executor HOME;
      - https://github.com/tenequm/skills/tree/main/skills/gh-cli   # ref SHA-pinned at run start
      - ./skills/local-example                                      # local path works too
    mcps:                         # MCP servers; ${VAR} expands from the engine's env at
                                  # spawn, never written out. Optional by default: an unset
                                  # var skips the server with a warning, recorded in
                                  # skipped_mcps; required: true refuses the run instead
      - {url: "https://glim.sh/mcp?apiKey=${GLIM_API_KEY}", required: true}
      - https://mcp.deepwiki.com/mcp                                # plain string = optional

workflow:

  # A deterministic job: no prompt, no agent, no model - just steps and evidence.
  fetch:
    pre-steps:
      - git clone --branch {{param:ref}} {{param:repo}} {{output:repo}}
    outputs: [repo]               # a directory output; implicit check: exists, non-empty
    post-steps:
      - git -C {{output:repo}} rev-parse --verify HEAD

  # An agent job using the profile as-is (string form).
  work:
    agent: executor
    needs: [fetch]
    pre-steps:
      # steps are argv, string form is sugar (quote-aware split, never a shell);
      # the array form is equivalent and better when arguments carry spaces or quotes
      - [git, clone, "{{artifact:fetch/repo}}", "{{output:repo}}"]
    prompt: |
      Read the brief at {{param:brief}}. Do the work in the repository at
      {{output:repo}}, committing as you go. Write a summary of what you did
      to {{output:summary.md}}.
    outputs: [repo, summary.md]
    post-steps:
      - test -s {{output:summary.md}}

  # An agent job amending the profile (object form): scalars replace, lists append,
  # options keys win; append_system_prompt appends after a blank line; harness may
  # not be amended.
  check:
    agent:
      profile: executor
      model: claude-sonnet-5
      timeout_seconds: 900
      append_system_prompt: Judge only what the summary claims.
      skills:
        - https://github.com/tenequm/skills/tree/main/skills/polish
    needs: [work]
    prompt: |
      Review the summary at {{artifact:work/summary.md}} against the repository
      at {{artifact:work/repo}}. Write PASS or FAIL as the only line of
      {{output:verdict}}, and your reasoning to {{output:review.md}}.
    outputs: [verdict, review.md]
    post-steps:
      - [grep, -qxE, "PASS|FAIL", "{{output:verdict}}"]

  # An agent job whose deliverable is its final message: the engine writes the agent's
  # text after its last tool call to message.md; declaring it requires it non-empty.
  summarize:
    agent: executor
    needs: [check]
    prompt: |
      Read {{artifact:check/review.md}}. Your final message is a three-line summary
      of it for the changelog.
    outputs: [message.md]

  # A dependent reads the final message like any other artifact.
  publish:
    needs: [summarize]
    post-steps:
      - [test, -s, "{{artifact:summarize/message.md}}"]
