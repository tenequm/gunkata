name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One job running the same command as the pre-push hook, so CI cannot drift from
# local. The flake pins the toolchain; `check-ci` owns what is checked.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c just check-ci
