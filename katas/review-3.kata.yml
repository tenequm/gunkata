      - {{artifact:prepare/changed-files.txt}} - the changed files
      - {{artifact:prepare/pr.md}} - the PR's metadata, description and commit messages
      - {{artifact:prepare/context.md}} - project constraints, intentional choices, author
        claims to verify, how rewritten or relocated code differs from what it replaced,
        competing fixes, and an inventory of the state the diff touches
      - {{artifact:prepare/base.md}} - the PR against the current base branch: conflicts,
        and each base commit touching the changed files with its message and tests

      `repo` is your own copy, made for this job: build it, run its tests, write a test that
      reproduces a suspected issue, check out another ref - whatever confirms or refutes a
      finding. Never write to {{artifact:prepare/repo}}, the original every job copies from.
