      - Competing fixes: for each entry under "Competing fixes" in context.md, and each base commit in base.md that touches code the PR changes, check every scenario its quoted message and its tests describe against the PR head - port the base's tests onto your copy of the PR head where feasible (`git show origin/<base>:<test file>`, adapted only as far as it takes to compile) and run them. Report the result either way: a finding when the PR head fails a scenario, a Checked entry with the test and its outcome when it holds. "The two versions are equivalent" is a clearance and needs this evidence
      - Evidence: every finding and clearance that rests on a test names the test, the command and its outcome; include the source of any test you wrote or ported, so the lead can re-run it without re-deriving it

      ## Design & Reuse

      Requires codebase exploration beyond the diff. Looks for structural and design issues.

      - **Reuse opportunities**: search the codebase for existing utilities, helpers, and shared modules that could replace newly written code. Look in utility directories, shared modules, and files adjacent to the changed ones. Flag hand-rolled logic where a utility already exists (string manipulation, path handling, type guards, env checks)
      - **Over-engineering**: helper functions used exactly once (should be inlined); abstractions wrapping a single call with no added value; try/catch adding nothing (re-throwing same error, catching impossibilities); validation of internal data already validated at route boundary; feature flags or config for things that could just be code; backwards-compat shims for code that was just written
      - **Redundant state**: state that duplicates existing state; cached values that could be derived; observers/effects that could be direct calls
      - **Parameter sprawl**: adding new parameters to a function instead of generalizing or restructuring existing ones
      - **Copy-paste with slight variation**: near-duplicate code blocks that should be unified
      - **Leaky abstractions**: exposing internal details that should be encapsulated, or breaking existing abstraction boundaries
      - **Stringly-typed code**: using raw strings where constants, enums, or branded types already exist in the codebase
      - **Structural issues**: functions that grew too long during changes (>50 lines, consider splitting); inconsistent naming with existing codebase conventions
      - **Behavior drift in relocated code**: when the diff moves or rewrites an existing path, compare it against the code it replaced (context.md lists where the prior versions live). Flag dropped input validation, removed guards or early-returns, and changed error semantics (status codes, return shapes). A refactor that changes *behavior* is a regression even when every line looks clean.

      ## Output

      Your final message is your findings: one numbered entry per finding with
      `path:line` (or a range), what the code does and why it is an issue, every distinct
      consequence you found, tagged `(pre-existing)` or `(out of diff)` where that applies,
      and its reproduction: the test, command and outcome, or "not reproduced" with what you
      tried. Then a Competing fixes section: each base scenario you checked and its result.
      Then a Checked section: what you examined and found clean, each clearance with the
      evidence the Rules require. With no findings, say so and still write Checked.
