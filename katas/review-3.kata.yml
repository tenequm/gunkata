      - **Verdict** - one line: confirmed, refuted, or inconclusive
      - **Evidence** - the exact commands you ran with their outcomes, the `path:line` sites
        you read, and the source of any test you wrote, so the lead can re-run it
      - **New findings** - anything the investigation surfaced that was not in the brief:
        one numbered entry each with `path:line`, the mechanism, every distinct consequence,
        tagged `(pre-existing)` or `(out of diff)` where that applies, and its reproduction
      - **Unresolved suspicions** - what you smelled but could not run to ground, and what
        would settle it. Mandatory and never empty on the grounds that everything was
        checked: if nothing is unresolved, say what you would look at with more time
    outputs: [message.md]
    post-steps:
      - git -C {{artifact:prepare/repo}} diff --quiet HEAD

