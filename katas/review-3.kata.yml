      - Do not flag efficiency on cold paths, one-time setup code, or scripts that run once
      - Never reproduce a credential value in a finding, a report line, or an agent prompt. A hardcoded key, token, password or connection string in the diff is a correctness finding of the highest order - cite it by `file:line` and describe it ("an AWS secret key is hardcoded"), never by value, and mask any value that must appear as `AKIA****`
      - A clearance is a claim, held to the same bar as a finding. A claim that a path is safe or a concern is cleared must cite every site that writes the state it relies on and every site that deletes, clears or resets it - grep for them and list each as `path:line`, never a sample. A case list you build is a floor, not a proof: say how you established it is complete - the search you ran and what it covered
      - Absent entries: when code treats a missing map entry, field or record as a meaningful state ("no deadline" means due, "no entry" means fresh), enumerate every path that can make it absent - including deletes, resets and failed or skipped writes - and check what the consumer does on each
      - Queued waiters: "it takes the lock" or "it waits, so it's safe" is not a clearance. Check what a waiter sees when it finally runs after the state it depends on changed underneath it - whether it re-reads, or acts on a value or decision taken before it waited
      - Replaced or removed guards: before concluding that a guard, check or early-return the diff replaces or removes is unneeded, search for counterexamples - inputs or states that still reach the code it protected - and read the base-branch commit that introduced it (`git log -S '<guard text>' origin/<base>`, or `git blame` on the base) for why it was added
      - Races and ordering: before dropping a suspected race or ordering bug, try to reproduce it with a test in your own copy. If it does not reproduce, say "could not reproduce" and what you tried - never "no issue"
      - Author claims: an item under "Author claims - verify" in context.md is the author's assertion, never evidence. Only "Intentional choices (don't flag)" exempts anything from being flagged

      ## Automated checks

      Review mode does not fix: each failure the checks job records is a finding. A PR that
      changes the validation command is itself a finding worth reporting.

      ## Phase 4: Audit the ledger

      The ledger has already run the first validation pass and the escalation rounds. Your
      job is neither to redo it from scratch nor to take it on trust. Read the current
      ledger, then read the code yourself: open every `path:line` a confirmed finding
      cites and confirm the code says what the row says. A row whose code does not match is
      dropped with the reason, whatever the ledger concluded.

      Then audit the ledger's own judgment:
      - **Refuted by a skeptic** - read the refutation and check it against the code. A
        refutation resting on a guard, a caller or a test names it; verify it exists and
        covers every path. A refutation you cannot verify does not stand: reinstate the
        finding
      - **Dropped** - same bar as a clearance. Verify the drop's evidence yourself, or move
        the item to **Cleared by a lens, not validated**
      - **Open** - each is a live gap; report it rather than letting it vanish
      - **Probe new findings** - every numbered finding a probe raised is a finding of this
        review, validated like any other, and enters **Raw to final**
      - **Raw to final** - the ledger's table is your starting point; yours must account for
        every lens finding and every probe finding, each exactly once

      Where the ledger's evidence is missing, everything below applies in full.

      Spend the effort where evidence is missing. A finding the lens reproduced - a named test, its command and a failing outcome, with the test's source when the lens wrote or ported it - is confirmed by checking that the test exercises what the finding claims, re-running it only if in doubt. A finding with no reproduction gets the full validation below, and so does every clearance.

      For each finding:
      - **Read the exact file and lines cited** - confirm the code exists and matches the description. Drop findings where the line number is wrong or the code doesn't match what was claimed
      - **Dead code / unused imports** - grep the entire codebase for references. If the symbol is referenced anywhere (imports, calls, type usage), drop the finding
      - **Reuse suggestions** - confirm the suggested utility/function actually exists at the claimed path. If it doesn't exist, drop the finding
      - **Debug leftovers** - confirm the flagged line is actually a debug artifact, not structured logging (`logger.*`, `c.var.logger.*`)
      - **Efficiency / design claims** - read the surrounding context to confirm the pattern matches. Drop speculative findings that don't hold up with full context
      - **Side-effect gating / behavior-drift claims** - confirm by reading the actual control flow: the side-effect line, the gate line, and the path between (including downstream handlers and middleware order). Validate a relocation regression against *the code it replaced*, not against sibling paths that may share the same flaw. Never drop one as "a behavior decision" or "out of scope" - if it holds up it is the highest-severity finding
      - **Rewritten or moved paths** - when a finding lands on rewritten/relocated code, check whether the flaw already existed at HEAD (or in the pre-move version). If it did, keep it as a finding tagged `(pre-existing)` - the regression vs. carried-through distinction is signal, not a demotion. Separately flag any test coverage deleted with the old path and not replaced

      Only findings that survive validation proceed to the report.

      ### Audit clearances

      Validate what the agents cleared, not only what they flagged. Each agent's Checked
      section is a list of clearances, and so is every finding you are about to drop. For
      each - an item a lens reports as clean, or a finding you are about to drop - re-check
      the clearance against the clearance Rules above: every writer and every deleter of the
      state it relies on cited and the case list shown complete, every path to an absent
      entry enumerated, queued waiters checked against state that changed under them, a
      removed guard's origin read on the base branch, a suspected race tried as a test. Then:
      - it holds, and you verified the evidence yourself: it stays cleared; a dropped finding
        goes under **Dropped after validation** with that evidence
      - your re-check finds a path it missed that breaks it: reinstate it as a finding in its
        category
      - its case list is incomplete or unverified and you could not close it: list it under
        **Cleared by a lens, not validated**, with what is missing

      Never put an item under **Dropped after validation** on a clearance you did not verify.

      ### Base drift

      Findings from base-branch drift are yours: the lenses review the diff, you own how it
      meets the current base. Treat as a candidate finding each conflict region base.md
      lists, each entry under "Competing fixes" in context.md, and each base commit in
      base.md that changes code the PR touches. For each, ask what resolving it either way -
      keeping the base's side, the PR's side, or both - would drop, duplicate or revert, and
      check the scenarios its quoted commit message and tests describe against the PR head,
      using the lenses' Competing fixes results where they ran them. Validate each candidate
      like any finding; a survivor is a finding under **Base drift**, a pre-merge ask.

      ## Phase 5: Report

      Synthesize validated findings into a single report. Merge two findings only when they share the same mechanism at the same lines - findings on the same code with different mechanisms stay separate. Every final finding names its source lens findings (e.g. `[design #2, side-effects #1]`) and keeps every distinct consequence its sources gave. Never drop a lens finding as a duplicate unless it is merged under this rule. Group by category:

      ```
      ## Review Findings

      ### Correctness (N issues)
      1. `path/to/file.ts:55` - chargeUser() runs before body validation (handler validates at :78, after next()); a malformed request is charged then 400s
      2. ...

      ### Base drift (N issues)
      1. `path/to/file.ts:60-72` - conflicts with the base's rewrite of the same retry loop; keeping the PR's side reverts the base's backoff cap [base.md conflict 1]

      ### Cleanliness (N issues)
      1. `path/to/file.ts:42` - console.log("debug response")
      2. ...

      ### Design (N issues)
      1. `path/to/file.ts:15-18` - hand-rolled path join, use existing `resolveAssetPath` from shared/utils
      2. ...

      ### Efficiency (N issues)
      1. `path/to/file.ts:30-45` - sequential awaits on independent API calls, use Promise.all
      2. ...

      ### Dropped after validation
      1. `path/to/view.py:12` - per-mousemove getBoundingClientRect - the element is CSS-fixed, so the rect is cached and there is no layout flush
      2. `path/to/file.ts:88` - flock fallback catches all lock errors, not just unsupported-filesystem ones - validated but not actionable; nothing to change

      ### Cleared by a lens, not validated
      1. `path/to/cache.ts:40` - design cleared the stale-entry read as "every caller refreshes the entry"; the evict path at :72 deletes it and was not in the case list, and no test was run - open

      ### Raw to final
      | Finding | Outcome |
      | --- | --- |
      | cleanliness #1 | kept as Cleanliness #1 |
      | design #2 | merged into Correctness #1 |
      | efficiency #3 | dropped - Dropped after validation #1 |
      | side-effects #2 | cleared, not validated - #1 |
      | probe round-1/item-2 #1 | kept as Correctness #2 |
      | side-effects #4 | refuted by probe round-1/item-3, refutation verified |

      **Total: X issues across Y categories**

      **Recommendation:** fix correctness #1, cleanliness #1-2, efficiency #1; skip design #2 (marginal).
      ```

      List **Correctness** first, and always - including at `(0 issues)`, since a zero there is a real signal that side-effect ordering was checked. A correctness zero must state what was traced - which side-effects were inventoried and which gates cover them - not just the count. It must never be batch-approved alongside cosmetic items.

      There is no non-blocking "observations" section: anything validated and worth acting on is a finding in its category (tagged `(pre-existing)` or `(out of diff)` where applicable); anything not worth acting on goes under **Dropped after validation** with the reason. That section substantiates the counts - omit it when empty. A clearance the audit could not verify goes under **Cleared by a lens, not validated** instead, never under Dropped - omit that section when empty.

      **Raw to final** lists every numbered finding from every lens, each exactly once: kept as a final finding, merged into one, dropped (pointing at its Dropped entry and reason), or cleared, not validated. Its counts must reconcile with the sections above. Always include it.

      End the report with a per-finding **Recommendation** line: which findings you'd fix and which you'd skip, so the user can approve by reference. Judge on long-term codebase benefit. Out-of-diff findings default to fix - defer one only when fixing it would bloat the commit beyond what belongs there, force a decision, or add more risk than value, and say which explicitly rather than leaving it open-ended. Scope hygiene loses when the fix is smaller than the explanation for deferring it; a low-risk fix that just eases maintenance is a fix, not a deferral.

      If zero issues found, report "Clean - no issues found", substantiate the correctness zero (what was traced and why it's clean), and offer next actions.

      Before the findings, add a **Base branch** section from base.md, checked against the
      repository: how far behind and ahead of the base the PR is, whether it conflicts and
      in which files, and what the base has changed since the merge base in the code the PR
      touches. Where the base has changed code a finding lands on, say so on that finding.
      Name each review agent with the number of findings it reported, and state how many
      escalation rounds ran, how many investigations each emitted, and what they changed.

      ### Review mode ending

      The report is a review draft, so the footer changes: derive a verdict from the validated
      findings. Header the report with the full PR URL and title, never a bare `#number`.

      Split the findings into **Pre-merge asks** and **Follow-ups** (candidate tickets) before
      deciding anything. Findings tagged `(pre-existing)` or `(out of diff)` are always follow-ups.

      **State gate first.** A draft PR, a closed or merged PR, or an ask the requester withdrew ->
      **skip**: post nothing, name the state that caused it, and still report every finding so the
      work is not lost. `skip` is reached only from PR state, never from finding severity.

      **Otherwise** classify every surviving pre-merge finding as exactly one of:

      - **SUGGESTION** - the author may ignore it and the PR is still fine to merge (nits,
        alternatives, questions where any answer is acceptable)
      - **BLOCKING QUESTION** - the verdict depends on the answer (intent or a contract that cannot
        be verified from the diff alone)
      - **BLOCKING FIX** - a commit on this PR is required. SEVERE if it involves security, data
        loss, an irreversible change, or a broken deploy path

      Follow-ups never enter the verdict. The verdict is the strictest match:

      | Strictest surviving finding | Verdict |
      | --- | --- |
      | any SEVERE blocking fix | request-changes |
      | any blocking fix or blocking question | comment-only |
      | suggestions only | approve-with-comments |
      | none | approve |

      Consistency check before drafting: an approve means every comment can be ignored. If any
      draft comment says "before merge", the verdict is not an approve.

      Nothing is posted by this run. End with exactly this line, nothing after it, so the
      verdict is the last thing in the report:

      ```
      **Recommended: <action>** - <one-sentence reason tied to the top finding>
      ```

      Your final message is the full report.
    outputs: [message.md]
    post-steps:
      - [grep, -q, '^\*\*Recommended: ', "{{output:message.md}}"]
      - git -C {{artifact:prepare/repo}} diff --quiet HEAD
