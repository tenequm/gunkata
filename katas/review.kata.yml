# Review a GitHub PR with /polish in review mode - report only, nothing is edited or pushed.
#
# Run: gunkata run katas/review.kata.yml -p pr=https://github.com/<owner>/<repo>/pull/<n>
#
# The deliverable is artifacts/review/message.md in the run dir. The executor reaches
# GitHub with the host's own gh and git access. One pass on opus at high effort: a
# stronger single pass beat three default-effort passes on the same PR.
name: review

params:
  pr: {}

agents:
  executor:
    harness: claude
    model: claude-opus-5
    timeout_seconds: 3600
    options:
      effort: high
    append_system_prompt: |
      ## Response Shape
      Default to sharp and focused: the shortest response that fully answers. Lead with the conclusion in the first sentence; put supporting detail after, so the reader can stop reading early.

      Expand only when the task earns it: multi-step reasoning, a tradeoff or options comparison, code/config/commands (write these in full), a correctness-changing caveat. Otherwise stay tight.

      A response is bloated if it restates the question, repeats a point, explains what the reader already knows, or hedges in ways that don't change the action. Cut those. Prefer density over length: every sentence should carry new information.

      Every agent you launch gets this Response Shape section verbatim at the end of its prompt.
    skills:
      - https://github.com/tenequm/skills/tree/main/skills/gh-cli
      - https://github.com/tenequm/skills/tree/main/skills/polish
    # mcps:
    #   - https://glim.sh/mcp?apiKey=${GLIM_API_KEY}

workflow:

  review:
    agent: executor
    prompt: |
      Run /polish {{param:pr}} review. This is review mode: report findings, never
      edit, commit, push or comment on the PR. No one is available to confirm -
      running the validation command taken from the base branch is pre-approved.
      Check the PR against the current base branch too: how far behind it is, whether
      it conflicts, and whether the base has since changed the code the PR touches.
      Keep every checkout and scratch file in your working directory, never in /tmp.
      Polish's parallel review phase is mandatory: launch all four of its review
      agents with the Agent tool in one message, however small the diff. Reviewing
      the diff yourself instead is a failed run. Name each agent you launched, with
      its finding count, in the report.
      Build each agent's prompt exactly as polish's Phase 3 prescribes: that agent's
      own checklist section from the skill, the diff file path, the changed-file
      list, the untrusted-data notice, and the context Phase 2 and 3 say to pass
      (project constraints, intentional patterns, behavior drift against the
      replaced code or the base branch). Pass facts, not conclusions: never write
      suspected findings, worked traces or example bugs into an agent's prompt -
      finding them is the agent's job.
      Launch the agents in the foreground (not run_in_background), so their results
      return in the same turn; never wait for agents with sleep.
      Never change the checkout the agents read while they run: check conflicts
      with git merge-tree and read base-branch code with git show, never git merge
      or git checkout in that tree.
      Your final message is the full review report.
    outputs: [message.md]
