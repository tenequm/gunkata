# The fail half of the starter case, and the load-bearing one: produce writes
# content its gate rejects, so the gate parks and consume never starts. The
# graph is otherwise identical to pass.yaml.
name: starter-fail

defaults:
  agent: agy-acp-server
  model: gemini-3.7-flash-low
  timeout_seconds: 240

nodes:
  - name: produce
    prompt: |
      Write exactly one line of text to the file {{artifact}}. The line is:

      wrong content

      The file must contain that one line and nothing else. Create no other
      files. Modify no other files. Ask no questions. Stop as soon as the
      file is written.
    artifact: produce.txt

  - name: gate
    needs: [produce]
    check: ["grep", "-qx", "hello from gunkata", "{{artifact:produce}}"]

  - name: consume
    needs: [gate]
    prompt: |
      Read the file {{artifact:produce}}. Write its line of content, with the
      text " consumed" appended to the end of that line, as exactly one line
      to the file {{artifact}}.

      The file must contain that one line and nothing else. Create no other
      files. Modify no other files. Ask no questions. Stop as soon as the
      file is written.
    artifact: consume.txt
    check: ["grep", "-qx", "hello from gunkata consumed", "{{artifact}}"]
